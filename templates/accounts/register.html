
{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account | Novora{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">N</div>
        <p class="auth-eyebrow">JOIN NOVORA</p>
        <h1>Create Account</h1>
        <p class="auth-subtitle">Start your shopping journey with us.</p>

        <form id="register-form">
            {% csrf_token %}
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" required>

            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" required>

            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" required>

            <label for="reg-password2">Confirm Password</label>
            <input type="password" id="reg-password2" required>

            <p class="auth-error" id="register-error"></p>

            <button type="submit" class="auth-submit">Create Account</button>
        </form>

        <p class="auth-switch">
            Already registered?
            <a href="/login/">Login</a>
        </p>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
